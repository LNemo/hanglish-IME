name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (model-free)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.10.4"
          python-version: "3.11"
          enable-cache: false

      - name: Install locked test dependencies
        run: uv sync --frozen --only-group dev --python 3.11

      - name: Check baseline assets
        run: uv run --no-sync python scripts/prepare_runtime_assets.py check --profile baseline

      - name: Run model-free tests
        run: >-
          uv run --no-sync pytest
          tests/test_dictionary.py
          tests/test_romanizer.py
          tests/test_baseline_assets.py
          tests/test_manual_diagnostics.py
          tests/test_prepare_runtime_assets.py
          tests/test_prepare_english_dictionary.py
          tests/test_bundled_engine_service.py
          tests/test_release_metadata.py
          tests/test_release_packaging.py
          tests/test_package_guides.py
          tests/test_bundle_model_licenses.py
          -q

  macos:
    name: macOS native (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64

      - name: Run native tests and type checking
        run: bash native/macos/test.sh

      - name: Run localization tests
        run: bash native/macos/Tests/test_localization.sh

      - name: Run installer lifecycle without input-source registration
        run: bash native/macos/Tests/test_installer.sh
