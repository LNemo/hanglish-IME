[project]
name = "hanglish-ime"
version = "0.1.0"
description = "A Romanized Korean IME"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pynput>=1.7.6",
    "pyqt6>=6.6.1",
    "pywin32>=306 ; sys_platform == 'win32'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hanglish"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
