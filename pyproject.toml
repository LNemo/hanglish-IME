[project]
name = "hanglish-ime"
version = "0.2.7"
description = "A Romanized Korean IME"
readme = "README.md"
license = "CC-BY-NC-4.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "licenses/**/*", "hanglish/core/data/*.COPYING"]
requires-python = ">=3.11"
dependencies = [
    "pynput>=1.7.6",
    "pyqt6>=6.6.1",
    "pywin32>=306 ; sys_platform == 'win32'",
]

[project.optional-dependencies]
learning = ["torch==2.14.0", "numpy==2.4.6", "wordfreq==3.1.1", "transformers==4.57.6", "safetensors==0.7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hanglish"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
